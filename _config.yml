title:              Data Science and AI for Economics
email:              danial.syed1@outlook.com
description:        Here I dive into my research and experiences leveraging frontier data science methods for economic, energy & environment challenges.
author:             M.Danial Syed
baseurl:            ""
url:                "https://mdanialsyed.github.io"

# Social Profiles
twitter_username:   
github_username:   https://github.com/MDanialSyed
facebook_username:  
instagram_username:  
linkedin_username: https://www.linkedin.com/in/danialsyedm/

# Add your google-analytics ID here to activate google analytics
google_analytics:   UA-XXXXXXXXX-X # out your google-analytics code

# Build settings
markdown:           kramdown
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
highlighter: rouge

# Pakistan Vitals: weekly notes live in their own collection so they
# don't mix with the main blog; pakistan/feed.xml gives them their own RSS feed.
collections:
  pakistan_notes:
    output: true
    permalink: /pakistan/notes/:name/

defaults:
  - scope:
      path: ""
      type: pakistan_notes
    values:
      layout: pakistan_note
      extra_css: ["/assets/pakistan/pakistan.css"]
      feed_url: "/pakistan/feed.xml"
      feed_title: "Pakistan Vitals weekly notes"

# Jekyll's own defaults, plus the Pakistan Vitals pipeline files that
# shouldn't be published.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts
  - CLAUDE.md
  - PAKISTAN_VITALS.md
  - pv-run-summary.md
