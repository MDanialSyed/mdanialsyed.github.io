---
layout: default
---

<header class="masthead">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-xl-9 mx-auto">
        <div class="page-heading">
          <h1>{{ page.title }}</h1>
          {%- if page.description %}
          <span class="subheading">{{ page.description }}</span>
          {%- endif %}
        </div>
      </div>
    </div>
  </div>
  {% include masthead-line.svg %}
</header>

<div class="page-body">
  <div class="container">
    {%- if page.wide %}
    {{ content }}
    {%- else %}
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto page-text">
        {{ content }}
      </div>
    </div>
    {%- endif %}
  </div>
</div>
