label = "Real GDP growth, latest quarter (y/y)"
section = "growth"
unit = "percent"
series = ["pbs_gdp_quarterly"]
status = "unmapped"

[[indicators]]
key = "spi"
label = "Weekly essentials basket, SPI (y/y)"
section = "inflation"
unit = "percent"
series = ["pbs_spi"]
status = "unmapped"

[[indicators]]
key = "kse100"
label = "KSE-100 index"
section = "markets"
unit = "index"
series = ["psx_kse100"]
status = "unmapped"

[[indicators]]
key = "brent"
label = "Brent crude, $ per barrel"
section = "markets"
unit = "US$ per barrel"
series = ["wb_brent"]
status = "unmapped"

[[indicators]]
key = "sbp_res"
label = "SBP foreign-exchange reserves"
section = "external"
unit = "US$ million"
series = ["sbp_reserves_sbp"]
status = "unmapped"

[[indicators]]
key = "total_res"
label = "Total liquid reserves (SBP + banks)"
section = "external"
unit = "US$ million"
series = ["sbp_reserves_total"]
status = "unmapped"

[[indicators]]
key = "trade_fytd"
label = "Goods trade deficit, fiscal year to date"
section = "external"
unit = "US$ million"
series = ["pbs_trade_balance"]
status = "unmapped"

[[indicators]]
key = "fbr_fytd"
label = "FBR tax collection, fiscal year to date"
section = "fiscal"
unit = "Rs billion"
series = ["fbr_collection"]
status = "unmapped"

[[indicators]]
key = "deficit_fy"
label = "Overall fiscal deficit"
section = "fiscal"
unit = "percent of GDP"
series = ["fd_overall_balance"]
status = "unmapped"

[[indicators]]
key = "primary_fy"
label = "Primary surplus"
section = "fiscal"
unit = "percent of GDP"
series = ["fd_primary_balance"]
status = "unmapped"

# ---------------------------------------------------------------- charts
# Histories drawn on the page, exactly as published.

[[charts]]
key = "lsm_fy_months"
label = "Large-scale manufacturing index by month, this fiscal year and last"
series = "sbp_lsm_index"
transform = "fy_months@1"
status = "confirmed"
confirmed = "30 Oct 2026: series name 'Quantum Index - Overall' and unit 'Index' as published by SBP; values drawn as published, no calculation"

[[charts]]
key = "imf_growth_path"
label = "Real GDP growth by fiscal year, IMF World Economic Outlook"
series = "imf_real_gdp_growth"
transform = "fy_years@1"
years_back = 9
status = "confirmed"
confirmed = "30 Oct 2026: years are fiscal years by their end year; IMF values match PBS for FY21 (5.8), FY22 (6.2) and FY23 (-0.2), and FY26 is 3.6 against PBS 3.65"

[[charts]]
key = "cpi_yoy_recent"
label = "National CPI inflation, year on year, last 24 months"
series = "sbp_cpi_yoy_national"
transform = "recent@1"
n = 24
status = "confirmed"
confirmed = "30 Oct 2026: same confirmed series as cpi_yoy; used to check the inflation chart"

