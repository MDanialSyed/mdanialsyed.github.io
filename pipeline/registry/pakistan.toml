# Source registry for Pakistan.
#
# Every published number is defined here: which publisher it comes from, which series code,
# and which named calculation turns the series into the figure on the page.
#
# Status of each series and indicator:
#   unmapped            the official series code is not yet identified
#   needs-confirmation  mapped, but not published until a run's values have been checked
#                       against the publisher's own release
#   confirmed           checked; published automatically from then on
#   retired             no longer used (kept so old lineage records stay readable)

[country]
code = "PAK"
name = "Pakistan"
fy_start_month = 7   # the fiscal year runs July to June; July 2026 to June 2027 is FY27

# ---------------------------------------------------------------- sources

[sources.sbp_easydata]
publisher = "State Bank of Pakistan"
dataset = "EasyData"
adapter = "easydata"
homepage = "https://easydata.sbp.org.pk/"
secret = "easydata"

[sources.world_bank_wdi]
publisher = "World Bank"
dataset = "World Development Indicators"
adapter = "worldbank"
homepage = "https://data.worldbank.org/country/pakistan"
terms = "CC BY 4.0"

[sources.imf_weo]
publisher = "International Monetary Fund"
dataset = "World Economic Outlook (DataMapper)"
adapter = "imf_datamapper"
homepage = "https://www.imf.org/external/datamapper/profile/PAK"

# Official releases published as files. Parsers are built and tested one release at a time.
[sources.pbs]
publisher = "Pakistan Bureau of Statistics"
dataset = "Releases: national accounts, CPI, SPI, external trade"
adapter = "files"
homepage = "https://www.pbs.gov.pk/"
status = "planned"

[sources.finance_division]
publisher = "Finance Division"
dataset = "Fiscal operations"
adapter = "files"
homepage = "https://www.finance.gov.pk/fiscal.html"
status = "planned"

[sources.fbr]
publisher = "Federal Board of Revenue"
dataset = "Revenue collection"
adapter = "files"
homepage = "https://www.fbr.gov.pk/"
status = "planned"

[sources.sbp_web]
publisher = "State Bank of Pakistan"
dataset = "Auction results and policy announcements"
adapter = "files"
homepage = "https://www.sbp.org.pk/"
status = "planned"

[sources.psx]
publisher = "Pakistan Stock Exchange"
dataset = "Index closes"
adapter = "files"
homepage = "https://dps.psx.com.pk/"
status = "planned"

[sources.wb_pink]
publisher = "World Bank"
dataset = "Commodity price data (Pink Sheet)"
adapter = "files"
homepage = "https://www.worldbank.org/en/research/commodity-markets"
terms = "CC BY 4.0"
status = "planned"

