# ---------------------------------------------------------------- indicators
# Keys match the dashboard. "display" sets how the value is written on the page; "value_scale"
# converts the publisher's unit to the page's; "context" adds the same calculation for the
# previous period and/or a year earlier beside the figure. "range", "jump_abs"/"jump_rel" and
# "max_age_days" are the check limits, in the page's unit.

[[indicators]]
key = "cpi_yoy"
label = "CPI inflation, national (y/y)"
section = "inflation"
unit = "percent"
series = ["sbp_cpi_yoy_national"]
transform = "as_published@1"
context = ["previous", "year_ago"]
display = { decimals = 1, suffix = "%" }
range = [-5.0, 60.0]
jump_abs = 5.0
max_age_days = 70
confirm = "Must match the national y/y in the PBS CPI release for the same month, to one decimal."

[[indicators]]
key = "cpi_mom"
label = "CPI, month on month"
section = "inflation"
unit = "percent"
series = ["sbp_cpi_mom_national"]
status = "unmapped"

[[indicators]]
key = "cpi_fytd"
label = "CPI average, fiscal year to date (y/y)"
section = "inflation"
unit = "percent"
series = ["sbp_cpi_fytd_national"]
status = "unmapped"

[[indicators]]
key = "lsm_m"
label = "Large-scale manufacturing (y/y)"
section = "growth"
unit = "percent"
series = ["sbp_lsm_index"]
transform = "yoy_pct@1"
context = ["previous"]
display = { decimals = 2, suffix = "%", plus = true }
range = [-50.0, 50.0]
jump_abs = 20.0
max_age_days = 100
confirm = "Must match the month's y/y in the PBS LSM release, to two decimals."

[[indicators]]
key = "lsm_fytd"
label = "Large-scale manufacturing, fiscal year to date (y/y)"
section = "growth"
unit = "percent"
series = ["sbp_lsm_index"]
transform = "fytd_mean_yoy_pct@1"
context = ["year_ago"]
display = { decimals = 2, suffix = "%", plus = true }
range = [-50.0, 50.0]
jump_abs = 20.0
max_age_days = 100
confirm = "Must match the fiscal-year-to-date y/y in the PBS LSM release, to two decimals."

[[indicators]]
key = "ca_m"
label = "Current account balance"
section = "external"
unit = "US$ million"
series = ["sbp_bop_current_account"]
transform = "as_published@1"
context = ["previous"]
display = { decimals = 0, prefix = "$", suffix = "m" }
range = [-5000.0, 5000.0]
jump_abs = 2500.0
max_age_days = 60
confirm = "Must match the month's current account balance in SBP's balance of payments summary."

[[indicators]]
key = "ca_fytd"
label = "Current account balance, fiscal year to date"
section = "external"
unit = "US$ million"
series = ["sbp_bop_current_account"]
transform = "fytd_sum@1"
context = ["year_ago"]
display = { decimals = 0, prefix = "$", suffix = "m" }
range = [-25000.0, 15000.0]
max_age_days = 60
confirm = "Must match the fiscal-year-to-date balance in SBP's summary; SBP revises earlier months, so a small gap points to a revision."

[[indicators]]
key = "repo_on"
label = "Overnight repo, weighted average"
section = "markets"
unit = "percent"
series = ["sbp_repo_rate"]
transform = "as_published@1"
context = ["previous"]
display = { decimals = 2, suffix = "%" }
range = [0.0, 30.0]
jump_abs = 3.0
max_age_days = 7
confirm = "Check that this series is the weighted-average overnight repo rate SBP shows on its home page."

[[indicators]]
key = "wb_gdp_usd"
label = "GDP, current US$ (World Bank)"
section = "reference"
unit = "US$"
series = ["wb_gdp_usd"]
transform = "as_published@1"
display = { decimals = 1, prefix = "$", suffix = "bn", scale = 1e-9 }
range = [1e11, 2e12]
max_age_days = 900
confirm = "Check which fiscal year the World Bank's latest year refers to for Pakistan."

[[indicators]]
key = "imf_gdp_proj"
label = "IMF real GDP growth projection, this fiscal year"
section = "reference"
unit = "percent"
series = ["imf_real_gdp_growth"]
transform = "next_calendar_year@1"
period_format = "fy_end_year"
display = { decimals = 1, suffix = "%" }
range = [-15.0, 20.0]
confirm = "Check that the IMF labels Pakistan's fiscal years by the year they end (2027 = FY27)."

[[indicators]]
key = "imf_cpi_proj"
label = "IMF inflation projection, this fiscal year (average)"
section = "reference"
unit = "percent"
series = ["imf_cpi_inflation"]
transform = "next_calendar_year@1"
period_format = "fy_end_year"
display = { decimals = 1, suffix = "%" }
range = [-5.0, 60.0]
confirm = "Check that the IMF labels Pakistan's fiscal years by the year they end (2027 = FY27)."

